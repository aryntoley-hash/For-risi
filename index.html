<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВНИМАНИЕ! КРИТИЧЕСКАЯ ОШИБКА</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ff4d4d;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 2rem; }
        p { font-size: 1.2rem; color: #00ff66; }
        .box {
            border: 2px solid #ff4d4d;
            padding: 20px;
            border-radius: 10px;
            background: #000;
        }
    </style>
</head>
<body onclick="vibrate()">
    <div class="box">
        <h1>⚠️ СИСТЕМА ВЗЛОМАНА ⚠️</h1>
        <p>Инициализация копирования галереи и контактов...</p>
        <p style="color: yellow;">Передано: <span id="count">0</span>%</p>
        <p style="font-size: 0.8rem; color: gray;">Нажми на экран для отмены...</p>
    </div>

    <script>
        let count = 0;
        setInterval(() => {
            if (count < 100) {
                count += Math.floor(Math.random() * 5) + 1;
                if(count > 100) count = 100;
                document.getElementById('count').innerText = count;
            }
        }, 150);

        function vibrate() {
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 500]);
            }
            alert("ОШИБКА ДОСТУПА! Данные отправлены на сервер.");
        }
    </script>
</body>
</html>
